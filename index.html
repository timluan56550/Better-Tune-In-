<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Better Tune In</title>
        <link rel="preload" as="image" href="images/Xmark.png">
        <link rel="preload" as="image" href="images/Xunmark.png">
         <link rel="preload" as="image" href="images/Xcross.png">
        <link rel="preload" as="image" href="images/openBook.png">
        
        <link rel="stylesheet" href="style.css">
         <!-- dev tools -->
        <!-- <script src="https://unpkg.com/eruda"></script>
    <script>eruda.init();</script> -->
    </head>

    
    <body>
<div id="everything">
    <div id="redEffect" class="hidden"></div>
    <div id="hud">
        <div class="hudRow">
            <span class="hudLabel">HP:</span>
            <div class="barBox">
                <div id="hpBar"></div>
            </div>
            <span id="maxHp">100/100</span>
        </div>
        <div class="hudRow">
            <span class="hudLabel">BATTERY:</span>
            <div class="barBox">
                <div id="batteryBar"></div>
            </div>
            <span id="maxBattery">100%</span>
        </div>
        <div id="clock">10:00 PM</div>
    </div>


    <div id="windowDisplay">
<img id="windowImage"src="images/window.png">
    </div>
    <div id="deskDisplay">
        <div id="radioBox">
            <div id="frequency">
                <button id="previousFrequency" class="arrowButton">◀</button>
            <div id="radioDisplay">
                <!-- AM 500 kHz to 1500 kHz -->
                 <!-- onclick with this.value makes it so when you select the box it clears otu everything but idk why its not colored properly -->
                <input type="text" id="freqInput" value="OFF" onclick="this.value=''" disabled/>
            </div>
                <button id="nextFrequency" class="arrowButton">▶</button>

            </div>
<img src="images/radio.png" id="radioImage">
            <button id="radioPower"></button>
        </div>
<div id="crankCover" title="Click to charge the Radio">
    <img id="crankImage" src="images/crank.png">
    <div id="crankWarning" class="hidden">RELEASE!</div>
</div>


        <div id="notebookBox">
            <!-- Object on the desk-->
            <div id="notebookCover">

            </div>

            <!-- Menu when you open it up -->
            
        </div>
<div id="notebookDisplay" class="hidden">
                <!-- tabs -->
                <div id="notebookTabs">
                    <button class="tabActive" id="tabButton1">1. Evidence</button>
                    <button class="tab" id="tabButton2">2. Guess</button>
                    <button class="tab" id="tabButton3">3. Info</button>
                </div>
                <!-- the page -->
                <div id="notebookPage">
                    <div class="notebook">

                    </div>
                </div>
</div>
<button id="closeNotebookButton" class="hidden">CLOSE</button>

<div id="coffee">
    <img id="coffeeImage" src="images/coffee.png">
</div>
    </div>
<div id="fileReport" class="hidden">
    <div id="reportBox">
        <h2 id="reportTitle">FILE REPORT</h2>
        <div id="reportStamp">PENDING</div>

        <div id="reportStats">
            <div class="reportRow">
                <span class="reportLabel">SHIFT DAY:</span>
                <span id="reportDay" class="reportValue">Day 1</span>
            </div>

            <div class="reportRow">
                <span class="reportLabel">SURVIVAL:</span>
                <span id="reportSurvival" class="reportValue">---</span>
            </div>

             <div class="reportRow">
                <span class="reportLabel">DEDUCTION:</span>
                <span id="reportDeduction" class="reportValue">---</span>
            </div>
             <div class="reportRow">
                <span class="reportLabel">YOUR GUESS:</span>
                <span id="reportGuess" class="reportValue">---</span>
            </div>
             <div class="reportRow">
                <span class="reportLabel">ANOMALY:</span>
                <span id="reportActual" class="reportValue">---</span>
            </div>
             <div class="reportRow">
                <span class="reportLabel">SHIFT ENDED:</span>
                <span id="reportTime" class="reportValue">---</span>
            </div>
        </div>
        <button id="shiftButton">NEXT SHIFT</button>
    </div>
</div>


</div>


        <script src="scripts/anomalies.js"></script>

        <script src="scripts/notebook.js"></script>
            <script src="scripts/radio.js"></script>

                <script src="scripts/game.js"></script>
                        <script src="scripts/crank.js"></script>
                        <script src="scripts/report.js"></script>




    </body>
</html>
