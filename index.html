<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Better Tune In</title>
        <link rel="stylesheet" href="style.css">
         <!-- dev tools -->
        <script src="https://unpkg.com/eruda"></script>
    <script>eruda.init();</script>
    </head>

    
    <body>
<div id="everything">
    <div id="windowDisplay">

    </div>
    <div id="deskDisplay">
        <div id="radioBox">
            <div id="frequency">
                <button id="previousFrequency" class="arrowButton">◀</button>
            <div id="radioDisplay">
                <!-- AM radio amplitutes is from 535 kHz to 1705 kHz -->
                <span id="frequencyNumber">505 kHz</span>
            </div>
                <button id="nextFrequency" class="arrowButton">▶</button>

            </div>
<img src="https://placehold.co/50x50">
            <div id="radioTuner">
                <span id="radioLabel">MANUAL TUNE</span>
                <!-- 505 kHz to 1505 kHz- can be anything-->
                <input type="text" id="freqInput" value="505"/>
            </div>
        </div>



        <div id="notepadBox">

        </div>

        

    </div>

</div>
        <script src="scripts/radio.js"></script>
    </body>
</html>
