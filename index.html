<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Better Tune In</title>
        <link rel="stylesheet" href="style.css">
         <!-- dev tools -->
        <script src="https://unpkg.com/eruda"></script>
    <script>eruda.init();</script>
    </head>

    
    <body>
<div id="everything">
    <div id="windowDisplay">

    </div>
    <div id="deskDisplay">
        <div id="radioBox">
            <div id="frequency">
                <button id="previousFrequency" class="arrowButton">◀</button>
            <div id="radioDisplay">
                <!-- AM radio amplitutes is from 535 kHz to 1705 kHz -->
                <span id="frequencyNumber">535 kHz</span>
            </div>
                <button id="previousFrequency" class="arrowButton">▶</button>

            </div>

            <div id="radioTuner">
                <span id="radioLabel">TUNER DIAL</span>
                <!-- 535 kHz to 1705 kHz -->
                <input type="text" id="freqSlider" min="535" max="1705" step="10" value="535kHz"/>
            </div>
        </div>



        <div id="notepadBox">

        </div>

        

    </div>

</div>
        <script src="scripts/game.js"></script>
    </body>
</html>
